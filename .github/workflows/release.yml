name: Release & Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-openvsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN || secrets.OVSX_PAT }}
        run: |
          if [ -n "$OPEN_VSX_TOKEN" ]; then
            npx ovsx publish mangabar-*.vsix --pat "$OPEN_VSX_TOKEN"
          else
            echo "::warning::OPEN_VSX_TOKEN secret not configured in repository. Skipping automatic publish to Open VSX. Add OPEN_VSX_TOKEN to repository secrets to enable automatic publishing."
          fi

