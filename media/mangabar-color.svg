<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>

    <!-- Page Gradients -->
    <linearGradient id="mb-page-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="mb-page-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Under-Page Shadow Gradients -->
    <linearGradient id="mb-page-under" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Ribbon Accent Gradient -->
    <linearGradient id="mb-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="mb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#mb-bg)" stroke="#222538" stroke-width="2"/>

  <!-- Ambient Radial Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#mb-glow)"/>

  <!-- Lower Page Layers (Paper Depth) -->
  <path d="M19 72c10-5 20-4 28 2V40c-8-6-18-7-28-2v34z" fill="url(#mb-page-under)" opacity="0.6"/>
  <path d="M81 72c-10-5-20-4-28 2V40c8-6 18-7 28-2v34z" fill="url(#mb-page-under)" opacity="0.6"/>

  <!-- Main Open Book Left Leaf -->
  <path d="M22 69c9-5 19-4 28 2V35c-9-6-19-7-28-2v36z" fill="url(#mb-page-left)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Main Open Book Right Leaf -->
  <path d="M78 69c-9-5-19-4-28 2V35c9-6 19-7 28-2v36z" fill="url(#mb-page-right)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Center Spine Fold -->
  <path d="M50 36v35" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 36v35" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>

  <!-- Inner Page Engraved Flow Lines -->
  <path d="M28 47c6-3 13-3 18 1" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M28 55c6-3 13-3 18 1" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M72 47c-6-3-13-3-18 1" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M72 55c-6-3-13-3-18 1" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Bookmark Ribbon Marker -->
  <path d="M47 35v17l3-2.5 3 2.5V35" fill="url(#mb-ribbon)" stroke="#f0abfc" stroke-width="1" stroke-linejoin="round"/>
</svg>
